plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
        implementation "androidx.viewpager:viewpager:1.0.0"
        // Wizard rediseñado como pantallas ViewPager2 + Fragment (patrón tomado de
        // ver/MiceWine-Application-master/, ver docs/bootstrap/ROOTFS_EMBEBIDO.md).
        implementation "androidx.viewpager2:viewpager2:1.1.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        // Editor de texto real para el tab Archivos (Fase 4b) — LGPL-2.1, uso como
        // dependencia sin modificar el código de la librería no obliga a relicenciar
        // Kairos (a diferencia de copiar código GPL de un proyecto como Xed-Editor).
        implementation platform("io.github.rosemoe:editor-bom:0.24.4")
        implementation "io.github.rosemoe:editor"
        implementation "io.github.rosemoe:language-textmate"
        // Autocompletado real vía LSP en Estudio (docs/ide/PLAN_REDISENO_ESTUDIO_IDE_2026-08-22.md
        // §LSP) — módulo oficial de la misma librería/BOM, NO una implementación propia del
        // protocolo JSON-RPC. Confirmado en Maven Central bajo el mismo groupId que "editor"/
        // "language-textmate" (io.github.Rosemoe.sora-editor), gestionado por el mismo BOM.
        implementation "io.github.rosemoe:editor-lsp"
        // `org.eclipse.lsp4j.*` (tipos del protocolo LSP: DefinitionParams, WorkspaceEdit,
        // TextEdit, LanguageServer, etc., usados directo en StudioLspController.kt) — el propio
        // POM de editor-lsp-0.24.4 declara "org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0" con
        // scope=runtime (confirmado leyendo el .pom real en la caché de Gradle), así que NO
        // queda expuesto en el classpath de COMPILACIÓN del consumidor — mismo gotcha ya
        // documentado abajo para kotlinx-coroutines-jdk8, esta vez para lsp4j. Sin esta línea,
        // cualquier `import org.eclipse.lsp4j.*` en nuestro propio código falla con
        // "Unresolved reference" pese a que la librería la usa internamente sin problema.
        implementation "org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0"
        // Requerida por la API suspend de editor-lsp (LspEditor.connectWithTimeout(), etc.) —
        // no estaba declarada en el proyecto todavía (confirmado por grep: ningún .kt del repo
        // importaba kotlinx.coroutines de verdad antes de esta ronda).
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
        // `CompletableFuture<T>.await()` (extensión suspend) — usada tanto DENTRO de editor-lsp
        // (ver io.github.rosemoe.sora.lsp.events.hover.HoverEvent.doHandleAsync en la librería
        // upstream) como en nuestro propio StudioLspController.requestDefinition/requestRename
        // (ronda 2026-08-26, hover/go-to-definition/rename cableados a UI). Vive en un artefacto
        // Maven SEPARADO de "-core"/"-android" (`kotlinx-coroutines-jdk8`) — una dependencia
        // `implementation` de editor-lsp no queda expuesta en el CLASSPATH DE COMPILACIÓN de
        // Kairos (solo en el de runtime, por cómo Gradle resuelve "implementation" de un AAR
        // consumido), así que sin esta línea `future.await()` en nuestro propio código no
        // resolvería en tiempo de compilación aunque la librería la use internamente sin
        // problema — declararla explícita evita depender de transitividad no garantizada.
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.1"

        implementation project(":terminal-view")
        implementation project(":termux-shared")

        // Motor de inferencia local (llama.cpp embebido, Fase 3 del roadmap,
        // ver docs/ia-local/LLAMA_CPP_EMBEBIDO.md) — pedido explícito del usuario de
        // agregarlo directo al build normal, no como variante aparte (a
        // diferencia del rootfs). ADVERTENCIA: esto compila llama.cpp+Vulkan
        // desde cero en CADA build de la app (incluido build-app.yml, el
        // workflow "normal") — build más pesado y, hasta la primera corrida
        // real de CI, sin verificar. Ver "Estado real" en
        // docs/ia-local/LLAMA_CPP_EMBEBIDO.md.
        implementation project(":llama-engine")

        // Servidor X11 embebido (Xlorie/termux-x11) — menú "Más" → X11. Clases
        // com.termux.x11.* + libXlorie.so precompilado (ver docs/x11/X11_EMBEBIDO.md).
        implementation project(":x11-server")

        // IDE integrado (paquete com.termux.app.ui.studio, tab "Más" → Estudio) — deps que
        // usa el port de ide-app. DocumentFile para el árbol SAF del sidebar, security-crypto
        // para AiProviderPrefs (EncryptedSharedPreferences) y recyclerview explícita para las
        // listas (FileTreeAdapter, CommandPalette, ProjectSearch). Ver
        // docs/ide/IDE_INTEGRADO.md.
        implementation "androidx.documentfile:documentfile:1.0.1"
        implementation "androidx.security:security-crypto:1.1.0"
        implementation "androidx.recyclerview:recyclerview:1.3.2"
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        // Versionado propio de Kairos desde acá (antes seguía el contador heredado de
        // termux-app, "0.126.0" — sin relación real con la madurez del proyecto). versionCode
        // se mantiene monotónico (Android lo exige para cualquier mecanismo de actualización),
        // versionName pasa a reflejar el estado real: beta temprana.
        versionCode 127
        versionName "0.1.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Kairos"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        if (file('testkey_untrusted.jks').exists()) {
            debug {
                storeFile file('testkey_untrusted.jks')
                keyAlias 'alias'
                storePassword 'xrj45yWGLbsO7W0v'
                keyPassword 'xrj45yWGLbsO7W0v'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            if (signingConfigs.findByName('debug')) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // El rootfs embebido (RootfsInstaller.kt) es un .tar.xz de ~300MB+ ya comprimido —
    // sin esto, AAPT2 intenta re-comprimirlo con DEFLATE al empaquetar el APK (gasto de
    // CPU/tiempo de build sin beneficio real, ya que un archivo .xz no se puede comprimir
    // más) y, más importante, hace que la lectura en runtime pase por decodificación
    // DEFLATE en vez de un acceso STORED (mmap-able) — patrón de riesgo real y conocido de
    // Android para binarios grandes ya comprimidos embebidos como asset. Agregado 2026-08-26
    // como hardening defensivo tras un fallo real sin confirmar en dispositivo (ver
    // docs/bootstrap/AUDITORIA_ROOTFS_END2END_2026-08-26.md) — NO confirmado como la causa
    // raíz exacta de ese fallo (la evidencia de código apunta a que RootfsInstaller SÍ
    // detectó el asset embebido; el fallo real quedó en un paso posterior sin diagnosticar
    // todavía), pero es una corrección de bajo riesgo y alta probabilidad de ayudar de
    // todos modos — no se aplicó a ciegas como "el fix", ver ese doc para el detalle.
    androidResources {
        noCompress += [".xz"]
    }

    // Nombre del .apk generado: "Kairos" (no "termux-app" heredado del fork) + version real +
    // variante + arquitectura legible (armv8 en vez del raw "arm64-v8a" de AGP; único ABI que
    // soporta este proyecto - ver minSdk/ARM64 en CLAUDE.md - "universal" cuando no hay split
    // por ABI, ver TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS en CLAUDE.md § Build).
    def friendlyAbiName = { String rawAbi ->
        if (rawAbi == null) return "universal"
        if (rawAbi == "arm64-v8a") return "armv8"
        return rawAbi
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("Kairos_" + android.defaultConfig.versionName + "_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + friendlyAbiName(abi) + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("Kairos_" + android.defaultConfig.versionName + "_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + friendlyAbiName(abi) + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
        // ViewBinding para el IDE integrado (paquete com.termux.app.ui.studio): genera
        // com.termux.databinding.ActivityStudio*Binding a partir de los layouts studio_*.xml.
        // Ver docs/ide/IDE_INTEGRADO.md.
        viewBinding true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"

    // Extracción de tar.xz 100% en JVM para RootfsInstaller.kt — sin shellear al
    // "tar" de Termux (patrón tomado de ver/MiceWine-Application-master/, mismo
    // par de librerías que usan ellos para su formato .rat, ver docs/bootstrap/ROOTFS_EMBEBIDO.md).
    implementation "org.apache.commons:commons-compress:1.27.1"
    implementation "org.tukaani:xz:1.9"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

