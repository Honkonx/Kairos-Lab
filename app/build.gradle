        def packageVariant = project.ext.packageVariant
        if (packageVariant == "apt-android-7") {
            def version = "2026.02.12-r1" + "%2B" + "apt.android-7"
            downloadBootstrap("aarch64", "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3", version)
            downloadBootstrap("arm", "a38f4d3b2f735f83be2bf54eff463e86dc32a3e2f9f861c1557c4378d249c018", version)
            downloadBootstrap("i686", "f5bc0b025b9f3b420b5fcaeefc064f888f5f22a0d6fd7090f4aac0c33eb3555b", version)
            downloadBootstrap("x86_64", "b7fd0f2e3a4de534be3144f9f91acc768630fc463eaf134ab2e64c545e834f7a", version)
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "+" + packageVariant
            downloadBootstrap("aarch64", "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7", version)
            downloadBootstrap("arm", "26bfb45304c946170db69108e5eb6e3641aad751406ce106c80df80cad2eccf8", version)
            downloadBootstrap("i686", "46dcfeb5eef67ba765498db9fe4c50dc4690805139aa0dd141a9d8ee0693cd27", version)
            downloadBootstrap("x86_64", "615b590679ee6cd885b7fd2ff9473c845e920f9b422f790bb158c63fe42b8481", version)
        } else {
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

// ── Rootfs embebido (opcional) ──────────────────────────────────────────
// Mismo patrón que downloadBootstrap()/downloadBootstraps de arriba, pero para
// el rootfs armado por .github/workflows/build-rootfs.yml (ver
// tools/rootfs/build_rootfs.py y docs/bootstrap/ROOTFS_EMBEBIDO.md). Gateado por la
// variable de entorno KAIROS_EMBED_ROOTFS — build-app.yml no la setea (APK
// liviano, el wizard descarga el rootfs en runtime), build-app-rootfs.yml sí
// (APK con el rootfs ya adentro, el wizard solo lo extrae, sin red).
def rootfsReleaseTag = System.getenv("KAIROS_ROOTFS_RELEASE_TAG") ?: "rootfs-2026.07.28"
// Apunta al futuro repo PÚBLICO kairos-lab (todavía no creado) a propósito — pedido
// explícito del usuario (docs/humano267.md): ningún link de descarga (rootfs, paquetes,
// update) debe apuntar al repo privado kairos-dev, ni siquiera hoy que kairos-lab no
// existe aún, para que el día que se cree y se suba la Release real esto funcione sin
// tocar código de nuevo. Consecuencia real HOY: este paso de CI (build-app-rootfs.yml)
// va a fallar hasta que kairos-lab exista con la Release publicada — aceptado a propósito.
def rootfsRepoOwner = "Honkonx"
def rootfsRepoName = "kairos-lab"
def rootfsAssetName = "kairos-rootfs-aarch64.tar.xz"
def rootfsAssetFile = new File(projectDir, "src/main/assets/kairos_rootfs.tar.xz")

// Honkonx/kairos-lab será un repo PÚBLICO una vez creado — a diferencia de cuando este
// comentario hablaba del privado kairos-dev, acá NO hace falta GITHUB_TOKEN para un
// asset de Release pública. El bloque de abajo describe el mecanismo real que hacía
// falta para el repo PRIVADO (documentado por si en algún momento se vuelve a necesitar
// descargar de un repo privado) — hoy, apuntando a kairos-lab público, un GET directo
// sin auth alcanza una vez que el repo/Release existan.
// Honkonx/Kairos [repo privado kairos-dev, ya no es el destino] — GitHub responde 404 (no 401/403, a propósito:
// no revela que el recurso existe) a cualquier descarga sin autenticar de un asset de
// Release privado, tanto por la URL directa "releases/download/<tag>/<archivo>" como
// por la API. Confirmado contra la documentación/comportamiento real de GitHub: esa
// URL directa NO acepta un header Authorization para repos privados — hay que resolver
// el asset vía la API REST (api.github.com) y pedirlo por id con
// "Accept: application/octet-stream". Ese endpoint responde con un 302 a una URL de
// storage ya firmada (Azure Blob/S3) — el header Authorization de GitHub NO debe
// reenviarse en ese segundo salto, o el storage rechaza el pedido por traer dos
// mecanismos de auth a la vez (su propia firma en la query string + el Bearer de
// GitHub). Ver docs/bootstrap/ROOTFS_EMBEBIDO.md, sección "Repo privado y GITHUB_TOKEN".
//
// GITHUB_TOKEN solo está disponible acá si build-app-rootfs.yml lo pasa explícitamente
// como env var al step de `./gradlew` (GitHub Actions lo genera automático por corrida,
// pero no lo inyecta a scripts salvo que el workflow lo declare). Sin token (build
// local, o CI sin la env var seteada), se cae al mismo comportamiento de antes: GET
// directo sin auth — funciona solo si el repo es público.
def downloadReleaseAsset(String owner, String repo, String tag, String assetName, File destFile) {
    def token = System.getenv("GITHUB_TOKEN")
    def out = new BufferedOutputStream(new FileOutputStream(destFile))
    try {
        if (!token) {
            def url = "https://github.com/" + owner + "/" + repo + "/releases/download/" + tag + "/" + assetName
            logger.quiet("Sin GITHUB_TOKEN — descargando sin autenticación: " + url)
            def connection = new URL(url).openConnection()
            connection.setInstanceFollowRedirects(true)
            out << connection.inputStream
            return
        }

        logger.quiet("GITHUB_TOKEN presente — resolviendo asset '" + assetName + "' vía API de GitHub (soporta repo privado)")
        def releaseUrl = "https://api.github.com/repos/" + owner + "/" + repo + "/releases/tags/" + tag
        def releaseConn = new URL(releaseUrl).openConnection()
        releaseConn.setRequestProperty("Authorization", "Bearer " + token)
        releaseConn.setRequestProperty("Accept", "application/vnd.github+json")
        releaseConn.setRequestProperty("X-GitHub-Api-Version", "2022-11-28")
        def releaseJson = new groovy.json.JsonSlurper().parseText(releaseConn.inputStream.getText("UTF-8"))
        def asset = releaseJson.assets.find { it.name == assetName }
        if (!asset) {
            throw new GradleException("No se encontró el asset '" + assetName + "' en la release '" + tag + "' de " + owner + "/" + repo)
        }

        def assetUrl = "https://api.github.com/repos/" + owner + "/" + repo + "/releases/assets/" + asset.id
        def assetConn = new URL(assetUrl).openConnection()
        assetConn.setRequestProperty("Authorization", "Bearer " + token)
        assetConn.setRequestProperty("Accept", "application/octet-stream")
        assetConn.setInstanceFollowRedirects(false)
        def responseCode = assetConn.responseCode
        if (responseCode == 302 || responseCode == 301) {
            def redirectUrl = assetConn.getHeaderField("Location")
            // A propósito sin el header Authorization acá — ver comentario arriba.
            def redirectConn = new URL(redirectUrl).openConnection()
            redirectConn.setInstanceFollowRedirects(true)
            out << redirectConn.inputStream
        } else if (responseCode == 200) {
            out << assetConn.inputStream
        } else {
            throw new GradleException("Descarga de asset falló con HTTP " + responseCode + ": " + assetUrl)
        }
    } finally {
        out.close()
    }
}

def sha256Hex(File file) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.eachByte(8192) { buffer, bytesRead -> digest.update(buffer, 0, bytesRead) }
    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    return checksum
}

task downloadRootfsAsset() {
    onlyIf { System.getenv("KAIROS_EMBED_ROOTFS") == "true" }
    doLast {
        rootfsAssetFile.parentFile.mkdirs()

        def sha256File = File.createTempFile("kairos-rootfs", ".sha256")
        try {
            downloadReleaseAsset(rootfsRepoOwner, rootfsRepoName, rootfsReleaseTag, rootfsAssetName + ".sha256", sha256File)
            def expectedChecksum = sha256File.text.trim().split(/\s+/)[0]

            logger.quiet("Descargando rootfs embebido: " + rootfsAssetName + " (tag " + rootfsReleaseTag + ")")
            downloadReleaseAsset(rootfsRepoOwner, rootfsRepoName, rootfsReleaseTag, rootfsAssetName, rootfsAssetFile)

            def checksum = sha256Hex(rootfsAssetFile)
            if (checksum != expectedChecksum) {
                rootfsAssetFile.delete()
                throw new GradleException("Checksum inválido para el rootfs embebido: esperado " + expectedChecksum + ", real " + checksum)
            }
            logger.quiet("Rootfs embebido OK: " + rootfsAssetFile)
        } finally {
            sha256File.delete()
        }
    }
}

clean {
    doLast {
        if (rootfsAssetFile.exists()) rootfsAssetFile.delete()
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
        variant.javaCompileProvider.get().dependsOn(downloadRootfsAsset)
    }
}
